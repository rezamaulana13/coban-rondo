<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logo Resmi Coban Rondo Outbound &amp; Adventure</title>
  <desc id="logoDesc">Logo heksagonal modern dengan elemen air terjun Coban Rondo, pegunungan Pujon, pohon pinus, dan kompas petualangan bernuansa Aqua, Teal, dan Emas.</desc>

  <defs>
    <!-- Aqua Gradient -->
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Deep Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="50%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F4C5C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND HEXAGON CREST ================= -->
  <g filter="url(#logoShadow)">
    <!-- Outer Gold Border Frame -->
    <polygon points="250,35 435,142 435,358 250,465 65,358 65,142" 
             fill="#FFFFFF" 
             stroke="url(#goldGrad)" 
             stroke-width="7" 
             stroke-linejoin="round"/>

    <!-- Inner Teal Base Polygon -->
    <polygon points="250,52 418,150 418,348 250,446 82,348 82,150" 
             fill="url(#tealGrad)"/>
  </g>

  <!-- ================= MOUNTAIN PEAKS ================= -->
  <!-- Left Mountain Peak -->
  <polygon points="82,270 170,145 250,250 250,350 82,348" fill="#134E4A"/>
  <!-- Left Mountain Shadow Highlight -->
  <polygon points="170,145 205,195 185,250 170,145" fill="#0A2D25" opacity="0.6"/>

  <!-- Right Mountain Peak -->
  <polygon points="418,270 330,145 250,250 250,350 418,348" fill="#134E4A"/>
  <!-- Right Mountain Highlight -->
  <polygon points="330,145 365,195 345,250 330,145" fill="#0A2D25" opacity="0.6"/>

  <!-- Snow Caps / Light Facets -->
  <polygon points="170,145 152,175 165,185 170,180 185,195 170,145" fill="#E0F2FE" opacity="0.85"/>
  <polygon points="330,145 312,175 325,185 330,180 345,195 330,145" fill="#E0F2FE" opacity="0.85"/>

  <!-- ================= ICONIC WATERFALL (COBAN RONDO) ================= -->
  <!-- Center Flow Main -->
  <path d="M 235,210 Q 230,280 160,375 Q 210,385 250,395 Q 290,385 340,375 Q 270,280 265,210 Z" 
        fill="url(#aquaGrad)"/>

  <!-- Dynamic Water Streams -->
  <path d="M 243,215 Q 238,275 190,365 Q 220,375 250,380 Q 280,375 310,365 Q 262,275 257,215 Z" 
        fill="#FFFFFF" opacity="0.35"/>
  
  <path d="M 250,225 L 250,380" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 235,260 Q 228,310 180,368" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 265,260 Q 272,310 320,368" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Bottom Splash Pool -->
  <path d="M 140,368 Q 250,440 360,368 Q 250,420 140,368 Z" fill="url(#aquaGrad)"/>

  <!-- ================= PINE TREES (HUTAN PINUS) ================= -->
  <!-- Left Outer Pine Tree -->
  <g fill="#00E5FF">
    <polygon points="120,240 102,280 138,280"/>
    <polygon points="120,265 95,315 145,315"/>
    <polygon points="120,295 88,355 152,355"/>
    <rect x="116" y="355" width="8" height="15" fill="#042F2E"/>
  </g>

  <!-- Left Inner Pine Tree -->
  <g fill="#0891B2">
    <polygon points="158,260 142,295 174,295"/>
    <polygon points="158,282 135,328 181,328"/>
    <polygon points="158,310 128,365 188,365"/>
    <rect x="154" y="365" width="8" height="12" fill="#042F2E"/>
  </g>

  <!-- Right Inner Pine Tree -->
  <g fill="#0891B2">
    <polygon points="342,260 326,295 358,295"/>
    <polygon points="342,282 319,328 365,328"/>
    <polygon points="342,310 312,365 372,365"/>
    <rect x="338" y="365" width="8" height="12" fill="#042F2E"/>
  </g>

  <!-- Right Outer Pine Tree -->
  <g fill="#00E5FF">
    <polygon points="380,240 362,280 398,280"/>
    <polygon points="380,265 355,315 405,315"/>
    <polygon points="380,295 348,355 412,355"/>
    <rect x="376" y="355" width="8" height="15" fill="#042F2E"/>
  </g>

  <!-- ================= COMPASS ROSE ADVENTURE STAR ================= -->
  <!-- Compass Outer Ring -->
  <circle cx="250" cy="115" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="6,3"/>
  <circle cx="250" cy="115" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>

  <!-- 8-Point Compass Star -->
  <!-- Main North Point -->
  <polygon points="250,58 256,110 250,115 244,110" fill="url(#goldGrad)"/>
  <polygon points="250,58 250,115 244,110" fill="#FDE68A"/>

  <!-- Main South Point -->
  <polygon points="250,172 256,120 250,115 244,120" fill="url(#goldGrad)"/>
  <polygon points="250,172 250,115 256,120" fill="#D97706"/>

  <!-- Main East Point -->
  <polygon points="307,115 255,109 250,115 255,121" fill="url(#goldGrad)"/>
  <polygon points="307,115 250,115 255,121" fill="#D97706"/>

  <!-- Main West Point -->
  <polygon points="193,115 245,109 250,115 245,121" fill="url(#goldGrad)"/>
  <polygon points="193,115 250,115 245,109" fill="#FDE68A"/>

  <!-- Diagonal Compass Points -->
  <polygon points="285,80 254,111 250,115 251,110" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="215,80 246,111 250,115 249,110" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="285,150 254,119 250,115 251,120" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="215,150 246,119 250,115 249,120" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Compass Star Center Core -->
  <circle cx="250" cy="115" r="4" fill="#FFFFFF"/>

  <!-- Cardinal Letter "N" for North / Adventure -->
  <text x="250" y="48" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="url(#goldGrad)" text-anchor="middle">N</text>

  <!-- ================= BOTTOM DIAMOND ACCENT ================= -->
  <polygon points="250,418 260,432 250,446 240,432" fill="url(#goldGrad)"/>
  <polygon points="250,418 250,446 240,432" fill="#FDE68A"/>
</svg>
